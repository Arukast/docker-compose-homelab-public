services:
  adguard:
    image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    container_name: ${ADGUARD_CONTAINER_NAME}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    network_mode: host
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL
    cap_add:
      # DNS on 53 over host networking needs NET_BIND_SERVICE once ALL is
      # dropped. NET_ADMIN + NET_RAW are what the built-in DHCP server needs
      # for its broadcast/raw sockets; inert when DHCP is disabled.
      - NET_BIND_SERVICE
      - NET_ADMIN
      - NET_RAW
    deploy:
      resources:
        limits:
          # No official sizing published. Steady state is ~300MB but a
          # filter-list rebuild transiently peaks near 890MiB
          # (AdGuardHome #8498), so 1g covers the spike.
          memory: 1g
          cpus: "1.0"
