services:
  adguard:
    image: adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
    container_name: ${ADGUARD_CONTAINER_NAME}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    network_mode: host
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL
    cap_add:
      # DNS on 53 over host networking needs NET_BIND_SERVICE once ALL is
      # dropped. NET_ADMIN + NET_RAW are what the built-in DHCP server needs
      # for its broadcast/raw sockets; inert when DHCP is disabled.
      - NET_BIND_SERVICE
      - NET_ADMIN
      - NET_RAW
      # work/conf on this fleet is deployer-owned (the old setup-target.sh ran
      # chown -R over the checkout). Root loses access to leases.json without
      # DAC_OVERRIDE and AGH fatal-loops on DHCP init; FOWNER covers chmod.
      - DAC_OVERRIDE
      - FOWNER
    deploy:
      resources:
        limits:
          # No official sizing published. Steady state is ~300MB but a
          # filter-list rebuild transiently peaks near 890MiB
          # (AdGuardHome #8498), so 1g covers the spike.
          memory: 1g
          cpus: "1.0"
