services:
  adguard:
    image: adguard/adguardhome:v0.107.79
    container_name: ${ADGUARD_CONTAINER_NAME}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    network_mode: host
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # No official sizing published. Steady state is ~300MB but a
          # filter-list rebuild transiently peaks near 890MiB
          # (AdGuardHome #8498), so 1g covers the spike.
          memory: 1g
          cpus: "1.0"
