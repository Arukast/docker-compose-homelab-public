# Authentik -- identity provider (SSO / OIDC / LDAP / forward proxy).
#
# Services mirror the upstream compose.yml, with the repo's house style applied:
# pinned image tag, no-new-privileges, cap_drop ALL plus only the caps each
# image actually needs, json-file log rotation, memory limits, and named
# volumes moved to bind mounts under this folder (upstream uses named volumes,
# which are invisible to the backup tooling in this repo).
#
# No proxy service: upstream ships none. `server` serves the UI, /api/ and
# /application/o/ from one process on one port, so NPM points straight at it
# and cloudflared points at NPM. See the note on 9443 below.
#
# No redis service: upstream ships none either. The cache and task queue fall
# back to postgres when redis is not configured.
#
# Deliberately no /etc/localtime or /etc/timezone mount, unlike every other
# service here. Authentik does all internal work in UTC and localizes only for
# display; mounting the host zone breaks OAuth and SAML auth (upstream
# documents this against a GitHub issue). If a future edit adds one back, that
# is the reason it must not stay.

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    container_name: ${AUTHENTIK_CONTAINER_NAME}-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    environment:
      - POSTGRES_DB=${PG_DB:-authentik}
      - POSTGRES_PASSWORD=${PG_PASS:?database password required}
      - POSTGRES_USER=${PG_USER:-authentik}
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the $ so compose hands it to the container, where it reads
      # the POSTGRES_* vars set above. A bare $ gets interpolated by compose
      # from .env and expands to empty when the name is not mirrored there.
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    networks: [auth-net]
    deploy:
      resources:
        limits:
          # Idle ~60MB; default shared_buffers (128MB) fits with headroom.
          memory: 512m
          cpus: "1.0"

  server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG}
    container_name: ${AUTHENTIK_CONTAINER_NAME}-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    command: server
    environment:
      - AUTHENTIK_POSTGRESQL__HOST=postgresql
      - AUTHENTIK_POSTGRESQL__NAME=${PG_DB:-authentik}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${PG_PASS:?database password required}
      - AUTHENTIK_POSTGRESQL__USER=${PG_USER:-authentik}
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY:?secret key required}
      # Authentik discards X-Forwarded-* unless the request arrived from a
      # trusted proxy, and NPM is that proxy here. Trust exactly the npm-net
      # subnet rather than the shipped RFC1918 defaults, so nothing that
      # reaches this container another way can forge X-Forwarded-Proto and
      # downgrade every generated URL to http://.
      - AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS=${AUTHENTIK_TRUSTED_PROXY_CIDRS}
      - AUTHENTIK_BOOTSTRAP_EMAIL=${AUTHENTIK_BOOTSTRAP_EMAIL:-}
      - AUTHENTIK_BOOTSTRAP_PASSWORD=${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
    # 512mb, from upstream. Django's threaded workers use /dev/shm for
    # cross-thread IPC; the 64mb default makes them fall back to the much
    # slower disk-backed files and a busy authentik crawls.
    shm_size: 512mb
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
    ports:
      - "${HOST_IP:-127.0.0.1}:9000:9000"
      # 9443 is authentik's built-in TLS. Left off: cloudflared already
      # terminates TLS upstream, and running both means a second cert to renew
      # for a hop that never leaves the host. Enable only if something reaches
      # this container without going through the tunnel.
      # - "${HOST_IP:-127.0.0.1}:9443:9443"
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      # `ak healthcheck`, not `ak health`. The image's own HEALTHCHECK runs the
      # former, and it is the only thing that works: the entrypoint script
      # dispatches `healthcheck` (passing the container's mode, read from
      # $TMPDIR/authentik-mode) but has no `health` case at all, so `ak health`
      # falls through to `python -m manage health` -- and authentik defines no
      # such management command. That exits non-zero on every run, which pins
      # the container at unhealthy while the server itself is serving fine.
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 5
      # First boot runs every migration, then the setup flow. That is minutes,
      # not seconds, so a slow migration must not read as a failed container.
      # The image default start period (120s) is too short for a cold boot.
      start_period: 300s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    networks: [auth-net, npm-net]
    deploy:
      resources:
        limits:
          # Django + gunicorn + the model embedding worker. Spikes well past
          # this during migrations; the limit is a backstop, not a budget.
          memory: 1g
          cpus: "1.0"

  worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG}
    container_name: ${AUTHENTIK_CONTAINER_NAME}-worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    command: worker
    environment:
      - AUTHENTIK_POSTGRESQL__HOST=postgresql
      - AUTHENTIK_POSTGRESQL__NAME=${PG_DB:-authentik}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${PG_PASS:?database password required}
      - AUTHENTIK_POSTGRESQL__USER=${PG_USER:-authentik}
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY:?secret key required}
    shm_size: 512mb
    # Upstream sets this. The worker writes to /certs and /data, which the
    # image ships owned by root; dropping to a non-root user breaks the
    # embedded-outpost cert renewal that is the whole point of this service.
    # user: root
    volumes:
      # Grants the worker control of the Docker socket, i.e. root on this
      # host. It needs this only to manage the embedded outpost containers.
      # Remove both this line and the -user: root above if you do not run an
      # embedded outpost; nothing else in authentik touches the socket.
      # - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./certs:/certs
      - ./custom-templates:/templates
    depends_on:
      postgresql:
        condition: service_healthy
    # No healthcheck declared here, so the image's own HEALTHCHECK
    # (`ak healthcheck`, mode read from $TMPDIR/authentik-mode) applies -- that
    # is what reports this container healthy in `docker ps`, not anything the
    # compose file sets. Nothing waits on the worker, so a failed probe is
    # informational only; read `docker logs` for its real state.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    networks: [auth-net]
    deploy:
      resources:
        limits:
          # Official install docs ask for a 2C/2GB host for the whole stack;
          # the worker idles ~360MiB (authentik #17869). Server + worker +
          # postgres total ~2.25g, matching that spec with headroom.
          memory: 768m
          cpus: "1.0"

networks:
  auth-net:
    driver: bridge
  # External so NPM can reach server:9000 and add a Proxy Host for it. Create it
  # first: docker network create npm-net
  npm-net:
    external: true
