# Authentik proxy host -- NPM Proxy Host -> Advanced -> Custom nginx config.
#
# Paste this whole file into the authentik host's Advanced tab. NPM injects
# it at server level of that host's vhost file.
#
# Assumes these NPM toggles stay ON (they emit server-level config this file
# builds on, and they keep the host working if this snippet is ever removed):
#   Details tab: scheme http, forward host authentik-server, port 9000,
#     Websocket Support ON, Block Common Exploits ON
#   SSL tab: certificate for your domain, Force SSL ON, HTTP/2 ON,
#     HSTS ON (+ subdomains), Trust Upstream Forwarded-Proto ON
# TLS terminates at NPM with this host's certificate; NPM talks plain HTTP
# to authentik-server:9000 over npm-net, and the tunnel talks to NPM.
#
# Why a "location /" block instead of bare proxy_set_header lines (which is
# what the previous version of this file did):
# - Nginx drops every server-level proxy_set_header inside a location that
#   sets its own headers, and NPM's default location always sets its own via
#   proxy.conf. So bare header lines at server level were silently ignored
#   while NPM's defaults still applied.
# - NPM skips generating its default location once the custom config defines
#   its own one for the root path, so the block below must do the proxying
#   itself. It reuses NPM's own include plus the host's Forward Scheme, Host
#   and Port variables, then applies authentik's overrides after the include,
#   where they take precedence.
# - Failure mode to know about: if the custom config ever fails the nginx
#   config test, NPM deletes this host's vhost file and reloads, and the
#   domain falls through to NPM's fallback server on port 80 serving the
#   stock welcome page. So a welcome page on port 80 means this snippet broke
#   the test, not that authentik is down. Check the host error log and the
#   .err file NPM keeps next to the generated vhost.

# Server-level tuning, inherited by the location below. Authentik streams
# (SSE) and holds some flows open, so disable buffering and raise timeouts
# above NPM's 60-90s defaults.
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 120s;
proxy_send_timeout 120s;

client_max_body_size 10m;

location / {
    # NPM's stock proxying: Host, X-Forwarded-Scheme/Proto/For, X-Real-IP and
    # the proxy_pass built from this host's Forward Scheme/Host/Port fields.
    include conf.d/include/proxy.conf;
    proxy_http_version 1.1;

    # WebSocket upgrade for outpost and proxy-provider traffic. Same
    # variables NPM uses for its own Websocket Support toggle: the client
    # sends Connection "Upgrade" exactly on upgrade requests, so upgrades
    # pass through and normal requests are untouched. Repeated here because
    # the server-level copies NPM emits do not reach inside this block.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    # REQUIRED, hardcoded. The tunnel reaches NPM over plain HTTP, so the
    # connection scheme here is "http" even though the browser used https.
    # Forwarding that makes authentik emit http:// URLs that the browser
    # blocks as mixed content, leaving an endless spinner on the login page.
    # The public scheme is always https here, so state it outright. Placed
    # after the include so it wins over the mapped value proxy.conf sets.
    proxy_set_header X-Forwarded-Proto https;

    # Original host, port-preserving. proxy.conf only sends Host, which drops
    # a non-standard port; authentik wants the original host for CSRF checks,
    # redirect URIs and handshake validation.
    proxy_set_header X-Forwarded-Host $http_host;
}
