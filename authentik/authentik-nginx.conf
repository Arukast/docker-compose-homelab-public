# Authentik's required NPM custom nginx config, as an include.
#
# Paste the contents of this file into NPM's Proxy Host -> Advanced -> Custom
# nginx config for the authentik host. Kept in the repo so the host definition
# is reviewable and reproducible rather than living only in NPM's database.
#
# Nothing here terminates TLS: cloudflared already owns the public cert and
# talks plain HTTP to NPM on the tunnel.

# REQUIRED. Authentik uses WebSockets for outpost and proxy-provider traffic.
# Without these, HTTP/1.1 negotiation never happens and that traffic fails
# while ordinary page loads keep working, which makes it look like an authentik
# bug rather than a proxy one.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
# Literal "upgrade", not the usual $connection_upgrade variable. NPM defines
# no map for that variable anywhere in the image, and the map directive is
# http-level so it cannot be declared from this Advanced field, which lands
# inside a location block. Referencing it here would send an empty Connection
# header and silently break every upgrade. Sending it unconditionally is safe:
# non-upgrade requests just carry a header upstream authn ignores.
# If you also tick NPM's "Websockets Support" on this Proxy Host, leave this
# line in place -- it is what actually reaches upstream.
proxy_set_header Connection "upgrade";

# REQUIRED, and deliberately hardcoded rather than $scheme.
#
# NPM sees plain HTTP from cloudflared, so $scheme here is "http" even though
# the browser used https. Passing that through makes authentik build http://
# URLs, which the browser then blocks as mixed content -- the documented
# symptom is an endless loading spinner on the login page. The public-facing
# scheme is always https in this topology, so state it outright.
proxy_set_header X-Forwarded-Proto https;

# Preserves the original host. Required for CSRF checks, redirect URI
# generation, and WebSocket handshakes. $http_host keeps the port when the
# client sent one, which $host would drop.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;

# Client IP. $proxy_add_x_forwarded_for appends to what cloudflared already
# sent, so the real client address stays at the front of the chain. Authentik
# picks the correct entry using its own trusted-proxy list, so this does not
# need to be sanitised here. See AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS in
# .env.example -- that list is what makes this chain trustworthy.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;

# SSE endpoint used by the authentik UI. NPM buffers responses by default,
# which stalls anything that streams.
proxy_buffering off;
proxy_cache off;

# Long-lived connections. Authentik holds some flows open for a long time;
# the 60s NPM default drops them mid-flow.
proxy_read_timeout 120s;
proxy_send_timeout 120s;

client_max_body_size 10m;
