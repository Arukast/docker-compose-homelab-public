services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: docker-socket-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - portainer_net
    environment:
      - LOG_LEVEL=info
      - PING=1
      - VERSION=1
      - INFO=1
      - EVENTS=1
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - SERVICES=1
      - TASKS=1
      - NODES=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      # Disable unless required:
      - POST=1
      - DELETE=1
      - EXEC=0
      - BUILD=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:2375/_ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    # HAProxy on :2375 (a high port) reading a root-owned docker.sock: root is
    # the file owner, so no capability is involved.
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # No official sizing published; same proxy as socket-proxy/ uses
          # there. HAProxy footprint is ~20MiB, 128m is generous.
          memory: 128m
          cpus: "0.5"

  portainer:
    image: portainer/portainer-ce:2.45.1@sha256:4d616db18cfeb5dd41a69c0958bc825c84483ea9cde1106eb82a5d26f3bd8b0e
    container_name: portainer-server
    restart: unless-stopped
    command: -H tcp://docker-socket-proxy:2375
    security_opt:
      - no-new-privileges:true
    networks:
      - portainer_net
    ports:
      - "${HOST_IP:-127.0.0.1}:9443:9443"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - portainer_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --quiet --spider https://localhost:9443/api/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    # Serves :9443 (a high port) and writes its root-owned named volume over a
    # TCP proxy -- no privileged operation survives the drop.
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # No official sizing published (requirements page covers ports and
          # versions only); Go API + UI idles well under 256m.
          memory: 256m
          cpus: "1.0"

networks:
  portainer_net:
    driver: bridge

volumes:
  portainer_data:
