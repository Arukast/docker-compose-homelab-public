services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.16.0@sha256:4393e642e233e5efd5adeb7f10918d4aaea71c9ed875b94190273fc8e87f9594
    container_name: ${NPM_CONTAINER_NAME}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - npm-net
      - cloudflared-net
    ports:
      - '80:80'
      - '443:443'
      - '81:81' # Admin Web UI locked to local access / Tailscale
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:81/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    cap_add:
      # Binds 80/443/81 in-container, so NET_BIND_SERVICE survives the drop.
      # /init may chown/chmod /data and spawn the nginx workers below root,
      # hence the file trio (same set the postgres entrypoints need).
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          # No official sizing published; nginx + Node admin UI idles small,
          # with a ~25MB/day leak reported in NPM #4182 -- 512m absorbs it.
          memory: 512m
          cpus: "1.0"

networks:
  npm-net:
    external: true
  cloudflared-net:
    external: true
