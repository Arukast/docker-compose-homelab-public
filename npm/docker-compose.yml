services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: ${NPM_CONTAINER_NAME}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - npm-net
      - cloudflared-net
    ports:
      - '80:80'
      - '443:443'
      - '81:81' # Admin Web UI locked to local access / Tailscale
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:81/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          # No official sizing published; nginx + Node admin UI idles small,
          # with a ~25MB/day leak reported in NPM #4182 -- 512m absorbs it.
          memory: 512m
          cpus: "1.0"

networks:
  npm-net:
    external: true
  cloudflared-net:
    external: true
