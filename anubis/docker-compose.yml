x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  anubis:
    image: ghcr.io/techarohq/anubis:v1.27.0@sha256:8828275668b7bc675679f100970f9714f731388fbbf66ae94de8aca952e3fc4a
    container_name: ${ANUBIS_CONTAINER_NAME:-anubis}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    environment:
      # The router behind the gateway (e.g. NPM's :80 listener). Anubis is
      # Host-agnostic: one instance filters every website the router serves.
      - TARGET=${ANUBIS_TARGET}
      # Bot policy: custom bypasses first, upstream default rules imported
      # at the end (see anubis/policy.yaml).
      - POLICY_FNAME=/data/cfg/botPolicy.yaml
      # Signs the challenge JWTs so pass cookies survive a restart.
      - ED25519_PRIVATE_KEY_HEX=${ANUBIS_ED25519_PRIVATE_KEY_HEX}
      # One challenge-pass cookie for every subdomain behind this gateway.
      - COOKIE_DOMAIN=${ANUBIS_COOKIE_DOMAIN}
      # Only allow post-challenge redirects back into this domain (kills the
      # "Redirect domain not allowed" open-redirect risk from the startup log).
      - REDIRECT_DOMAINS=${ANUBIS_COOKIE_DOMAIN},*.${ANUBIS_COOKIE_DOMAIN}
      - SERVE_ROBOTS_TXT=${ANUBIS_SERVE_ROBOTS_TXT:-true}
      - DIFFICULTY=${ANUBIS_DIFFICULTY:-4}
    volumes:
      - ./anubis/policy.yaml:/data/cfg/botPolicy.yaml:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - anubis-net
      - npm-net
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Image runs as uid 1000 and only binds the unprivileged :8923; nothing
    # in this container needs a capability.
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # Upstream sizing note: "128Mi of ram may be sufficient for a large
          # number of concurrent clients". 256m covers challenge-page spikes.
          memory: 256m
          cpus: "0.5"

networks:
  # Shared with npm-front (TLS edge forwards to anubis:8923).
  # Create once per host: docker network create anubis-net
  anubis-net:
    external: true
  npm-net:
    external: true
