x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  omniroute:
    image: diegosouzapw/omniroute:3.8.52@sha256:b08a12e876baa8a5ccadd1ebbe346fe7267dba3b1c9f4fd6bb02070fae41ab6c
    container_name: ${OMNIROUTE_CONTAINER_NAME:-omniroute}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    ports:
      - "${HOST_IP:-127.0.0.1}:20128:20128"
    volumes:
      - ./omniroute-data:/app/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-20128}
      - DATA_DIR=${DATA_DIR:-/app/data}
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY_SECRET=${API_KEY_SECRET}
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY}
      - STORAGE_ENCRYPTION_KEY_VERSION=${STORAGE_ENCRYPTION_KEY_VERSION:-v1}
      - MACHINE_ID_SALT=${MACHINE_ID_SALT}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://searxng:8080}
      # Try to fix heavy long chat claude code
      - OMNIROUTE_CHAT_MAX_HEAVY_IN_FLIGHT=2
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    # Image already runs as USER node, which holds no effective capability;
    # dropping ALL changes nothing at runtime and documents the intent.
    cap_drop:
      - ALL
    networks: [ai-net, ai-backend-net]
    deploy:
      resources:
        limits:
          # was 4g, uses ~1.5GiB. 2.5g covers a long concurrent-chat spike
          # without eating half the LXC.
          memory: 2500m
          cpus: "2.0"

  redis:
    image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    container_name: ${REDIS_CONTAINER_NAME:-omniroute-redis}
    restart: unless-stopped
    <<: *default-logging
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --pidfile /tmp/redis.pid
    user: "999:999"
    volumes:
      - ./omniroute-redis-data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [ai-backend-net]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          # --maxmemory 256mb above; 128m headroom for buffers/fragmentation.
          memory: 320m
          cpus: "0.5"

networks:
  ai-net:
    external: true
  ai-backend-net:
    external: true
    name: shared-ai-backend-net
