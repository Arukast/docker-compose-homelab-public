x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Stirling-PDF -- self-hosted PDF toolkit (merge, split, compress, OCR,
  # convert, sign). Serves one UI on 8080.
  #
  # Login is ON by default: a fresh boot creates admin / stirling. Change
  # that password immediately after first login, or set
  # SECURITY_ENABLELOGIN=false for a no-auth instance (LAN-only).
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:3.0.0
    container_name: ${STIRLING_CONTAINER_NAME:-stirling-pdf}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    ports:
      - "${HOST_IP:-127.0.0.1}:${STIRLING_PORT:-8082}:8080"
    volumes:
      # All persistent state lives under ./stirling-pdf/ next to this file.
      - ./stirling-pdf/configs:/configs
      - ./stirling-pdf/logs:/logs
      - ./stirling-pdf/pipeline:/pipeline
      - ./stirling-pdf/tessdata:/usr/share/tessdata
      - /etc/localtime:/etc/localtime:ro
    environment:
      - SECURITY_ENABLELOGIN=${SECURITY_ENABLELOGIN:-true}
      - SYSTEM_DEFAULTLOCALE=${SYSTEM_DEFAULTLOCALE:-en-US}
    healthcheck:
      # The image has curl but no wget, and with login enabled "/" redirects to
      # the sign-in page. /api/v1/info/status is public and is what the image's
      # own HEALTHCHECK probes, so it works both with and without login.
      test: ["CMD-SHELL", "curl -fs --max-time 10 http://127.0.0.1:8080/api/v1/info/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Java + LibreOffice boot is slow; a cold start must not read as failed.
      start_period: 120s
    cap_drop:
      - ALL
    cap_add:
      # The image starts as root and its entrypoint chowns/chmods its own dirs
      # (/tmp/stirling-pdf owned by uid 1000, /var/lib/libreoffice-sandbox owned
      # by uid 1100) and then drops privileges. Without DAC_OVERRIDE/FOWNER those
      # setup steps fail with EACCES and the entrypoint aborts under `set -e`,
      # causing a restart loop. KILL is needed to signal the dropped-privilege
      # Java/unoserver processes on shutdown.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETUID
      - SETGID
    networks: [stirling-net]
    deploy:
      resources:
        limits:
          # Spring Boot + LibreOffice. Spikes past this under heavy OCR; the
          # limit is a backstop, not a budget.
          memory: 2g

networks:
  stirling-net:
    driver: bridge
    internal: true
