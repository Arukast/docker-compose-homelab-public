x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile.open-webui
    container_name: ${OPENWEBUI_CONTAINER_NAME:-open-webui}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    ports:
      - "${HOST_IP:-127.0.0.1}:8080:8080"
    volumes:
      - ./open-webui-data:/app/backend/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ENABLE_PERSISTENT_CONFIG=${ENABLE_PERSISTENT_CONFIG}
      - WEBUI_URL=${WEBUI_URL}
      # Integration AI
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-http://litellm-proxy:4000/v1}
      - OPENAI_API_KEY=${LITELLM_API_KEY}
      # Embedding RAG
      - RAG_EMBEDDING_ENGINE=
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-BAAI/bge-m3}
      # Web Search
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-true}
      - WEB_SEARCH_ENGINE=${WEB_SEARCH_ENGINE:-searxng}
      - SEARXNG_QUERY_URL=${SEARXNG_QUERY_URL:-http://searxng:8080/search?q=<query>}
      # OIDC
      - ENABLE_OAUTH_PERSISTENT_CONFIG=${ENABLE_OAUTH_PERSISTENT_CONFIG}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-changeme}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-changeme}
      - OAUTH_PROVIDER_NAME=${OAUTH_PROVIDER_NAME:-changeme}
      - OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL:-changeme}
      - OPENID_REDIRECT_URI=${OPENID_REDIRECT_URI:-changeme}
      - ENABLE_OAUTH_SIGNUP=${ENABLE_OAUTH_SIGNUP:-true}
      - ENABLE_LOGIN_FORM=${ENABLE_LOGIN_FORM:-false}
      - ENABLE_PASSWORD_AUTH=${ENABLE_PASSWORD_AUTH:-false}
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=${OAUTH_MERGE_ACCOUNTS_BY_EMAIL:-true}
      - ENABLE_OAUTH_ROLE_MANAGEMENT=${ENABLE_OAUTH_ROLE_MANAGEMENT:-true}
      - OAUTH_SCOPES=${OAUTH_SCOPES:-"openid email profile roles"}

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    cap_drop:
      - ALL
    cap_add:
      # ./open-webui-data is deployer-owned (functions/ is tracked in git), so
      # the root process creating files inside it needs DAC_OVERRIDE/FOWNER;
      # CHOWN covers start.sh re-owning the directory.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    networks: [ai-net, ai-backend-net]
    deploy:
      resources:
        limits:
          # was 5g, then 2g while bge-m3 lived in the separate embedder. Back to
          # 5g now that it lives here again: the weights are ~2.3GB and must be
          # resident, and a 2g ceiling would OOM the chat UI on the first
          # embedding call. This is the real cost of in-process embeddings --
          # chat and RAG share one ceiling.
          memory: 5g
          cpus: "2.0"

networks:
  ai-net:
    external: true
  ai-backend-net:
    external: true
    name: shared-ai-backend-net
