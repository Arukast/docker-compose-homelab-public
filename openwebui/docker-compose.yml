x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile.open-webui
    container_name: ${OPENWEBUI_CONTAINER_NAME:-open-webui}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    ports:
      - "${HOST_IP:-127.0.0.1}:8080:8080"
    volumes:
      - ./open-webui-data:/app/backend/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      # Chat goes through litellm (PII guardrail). Embeddings do NOT: they are
      # vectorized in-process here, bypassing the proxy. An embedding request is
      # a vectorization, not a disclosure -- routing it through presidio would
      # mask numbers before they are embedded and silently corrupt the vectors.
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-http://litellm-proxy:4000/v1}
      # Must be litellm-proxy's LITELLM_MASTER_KEY, not OmniRoute's key
      - OPENAI_API_KEY=${LITELLM_API_KEY}
      # In-process embeddings, not a remote TEI. bge-m3 is the smallest model I
      # found that actually handles Indonesian, and on this 11GB LXC it will not
      # run as a separate container: TEI reserves a full --max-batch-tokens
      # forward pass at startup and the box ran dry (exit 137, memory.peak
      # 11.8GB). open-webui only allocates for the text it is given, so a chat
      # message costs a few hundred tokens instead of a pre-allocated 8192.
      # It is on ai-net, which has egress, so sentence-transformers fetches the
      # weights on first boot into ./open-webui-data/cache/embedding.
      - RAG_EMBEDDING_ENGINE=sentence-transformers
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-BAAI/bge-m3}
      - RAG_EMBEDDING_ENGINE_MODEL_ID=${RAG_EMBEDDING_MODEL:-BAAI/bge-m3}
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-true}
      - WEB_SEARCH_ENGINE=${WEB_SEARCH_ENGINE:-searxng}
      - SEARXNG_QUERY_URL=${SEARXNG_QUERY_URL:-http://searxng:8080/search?q=<query>}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [ai-net, ai-backend-net]
    deploy:
      resources:
        limits:
          # was 5g, then 2g while bge-m3 lived in the separate embedder. Back to
          # 5g now that it lives here again: the weights are ~2.3GB and must be
          # resident, and a 2g ceiling would OOM the chat UI on the first
          # embedding call. This is the real cost of in-process embeddings --
          # chat and RAG share one ceiling.
          memory: 5g
          cpus: "2.0"

networks:
  ai-net:
    external: true
  ai-backend-net:
    external: true
    name: shared-ai-backend-net
