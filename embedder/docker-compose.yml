x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Separate from open-webui on purpose: bge-m3 is ~2.3GB of weights, and
  # sentence-transformers loads it INSIDE the open-webui process, which is what
  # pushed that container to a 5g limit. Here it is its own container with its
  # own ceiling and its own restart, so an embedding request cannot OOM-kill
  # your chat UI.
  #
  # Reached only over the internal backend network -- no host port. The only
  # client is open-webui.
  text-embeddings-inference:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: ${TEI_CONTAINER_NAME:-text-embeddings-inference}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Needed ONLY for the first boot, to pull bge-m3 from Hugging Face. The
    # shared-ai-backend-net resolver returns SERVFAIL for huggingface.co, so the
    # container cannot download its own model without this -- every other image
    # in the stack pulled fine because Docker resolves registry names through the
    # host, not the container.
    # Safe to drop once ./tei-cache holds the weights: the model is then read
    # from disk and no network is touched. Test before removing --
    # `docker compose logs | grep -i dns`.
    dns:
      - 1.1.1.1
      - 9.9.9.9
    <<: *default-logging
    volumes:
      - ./tei-cache:/data
      - /etc/localtime:/etc/localtime:ro
    command:
      - --model-id
      # English + Indonesian both strong; 1024-dim, 8192-token context.
      - ${EMBED_MODEL:-BAAI/bge-m3}
      # bge-m3 is a CLS-pooled model. The wrong pooling silently returns
      # garbage vectors that still *look* valid -- RAG just gets worse with no
      # error anywhere.
      - --pooling
      - cls
      # cpu-1.8 accepts float16|float32 (verified via --help). float32 is the
      # CPU-correct choice; float16 here is slower without saving meaningful RAM.
      - --dtype
      - float32
      # No --normalize: cpu-1.8 rejects it outright ("unexpected argument") and
      # the container crash-loops on boot. Verify any further flags against
      # `docker compose run --rm text-embeddings-inference --help` before adding
      # them -- an unrecognised flag takes the whole service down, and when TEI
      # is down open-webui silently falls back to downloading the model itself.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The image pulls and loads ~2.3GB of weights on first boot. start_period
      # must outlast that or the container is marked unhealthy during startup.
      start_period: 300s
    networks: [ai-backend-net]
    deploy:
      resources:
        limits:
          # Weights ~2.3GB, resident ~2.5GB with tokenization overhead.
          memory: 3g

networks:
  ai-backend-net:
    external: true
    name: shared-ai-backend-net
