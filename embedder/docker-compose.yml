x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # One-shot model download. Runs on ai-net, which has a route out; the
  # shared-ai-backend-net is created with --internal, so nothing on it can
  # resolve huggingface.co ("Network is unreachable"). It exits 0 and stays
  # exited, and `service_completed_successfully` below gates the server on it.
  #
  # Idempotent: the guard exits before touching the network once the weights are
  # on disk, so a redeploy costs a container start rather than a 2.3GB pull.
  # This is what lets a 2.3GB model live outside the image -- `docker compose up
  # --build` in deploy-service.sh was exhausting the disk on the export step.
  # EMBED_MODEL is not read from .env (there is none); override by exporting it
  # before `docker compose up`, which rewrites nothing on disk.
  model-fetch:
    image: python:3.14-slim@sha256:0741d101873c12ab927e6f8653feb8862b9bd58771177acb1b885b95141f91b4
    container_name: ${TEI_FETCH_CONTAINER_NAME:-tei-model-fetch}
    restart: "no"
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    networks: [ai-net]
    volumes:
      - tei-model:/model
    command:
      - sh
      - -c
      - |
        # The Hub file is capital-P Pytorch_model.bin (and capital-C Config.json),
        # NOT config.json, so the old guard never fired and every deploy
        # re-walked the Hub with a full volume already sitting there.
        if [ -f /model/pytorch_model.bin ] || [ -f /model/Pytorch_model.bin ]; then
          echo "weights already in volume, skipping download"
          exit 0
        fi
        pip install --no-cache-dir -q huggingface_hub
        # No ignore_patterns fetched 4.3GB, not 2.3GB: the ONNX export, the
        # ColBERT/sparse heads and the README images are all dead weight for a
        # --pooling cls load. Ignoring them halves the volume on a disk that ran
        # out of space during a previous build.
        python -c "from huggingface_hub import snapshot_download; \
        snapshot_download('${EMBED_MODEL:-BAAI/bge-m3}', local_dir='/model', \
        ignore_patterns=['Onnx/*', 'onnx/*', '*.onnx', 'Imgs/*', '*.jpg', \
        'Colbert_linear.pt', 'Sparse_linear.pt', '*.md'])"
        echo "model downloaded"
    # One-shot root container: pip into the image's own site-packages and write
    # its root-owned volume. No ports, no privilege drop.
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # pip install pulls torch-adjacent wheels; 1g is enough for the
          # download+extract and stops a bad day from eating the LXC.
          memory: 1g
          cpus: "0.5"

  # Separate from open-webui on purpose: bge-m3 is ~2.3GB of weights, and
  # sentence-transformers would otherwise load it INSIDE the open-webui process,
  # which is what pushed that container to a 5g limit. Here it is its own
  # container with its own ceiling and its own restart, so an embedding request
  # cannot OOM-kill your chat UI.
  #
  # Internal network only: by the time it starts, the weights are already in the
  # tei-model volume, so it never needs egress.
  text-embeddings-inference:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8@sha256:8de25e75ce39617f17f2f6c77d60a4f75b65e779ed5005420eb1400072a15c1c
    container_name: ${TEI_CONTAINER_NAME:-text-embeddings-inference}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    depends_on:
      model-fetch:
        condition: service_completed_successfully
    volumes:
      - tei-model:/model:ro
      - ./tei-cache:/data
      - /etc/localtime:/etc/localtime:ro
    command:
      # Local path, not a Hub id: the runtime container is on an --internal
      # network and could never download a model. Verified against --help, which
      # accepts "a local directory ... as saved by save_pretrained".
      - --model-id
      - /model
      # bge-m3 is a CLS-pooled model. The wrong pooling silently returns garbage
      # vectors that still *look* valid -- RAG just gets worse with no error
      # anywhere.
      - --pooling
      - cls
      # cpu-1.8 accepts float16|float32 (verified via --help). float16 halves the
      # weights: bge-m3 is 2.27GB in fp32, ~1.15GB in fp16. That is the whole
      # ballgame on this box -- the LXC is 11GB total with ~2.4GB already used by
      # the rest of the stack, and the model was being SIGKILLed (exit 137) once
      # the box ran dry, not by its own limit. Slower per request on CPU, which is
      # the correct trade against not existing at all.
      - --dtype
      - float16
      # Activation memory scales with batch tokens, not just weights. Default is
      # 16384; bge-m3 tops out at 8192 tokens per request anyway, so halving this
      # costs nothing real and cuts the warmup peak.
      - --max-batch-tokens
      - "8192"
      # No --normalize: cpu-1.8 rejects it outright ("unexpected argument") and
      # the container crash-loops on boot. Check any new flag with
      # `docker compose run --rm text-embeddings-inference --help` first -- an
      # unrecognised flag takes the service down, and while TEI is down
      # open-webui silently falls back to downloading the model itself.
      # Caps tokenizer memory. Default 512 in flight is sized for a GPU serving
      # many clients; on CPU it only buys contention and transient allocations.
      - --max-concurrent-requests
      - "32"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Loading 2.3GB of weights from the volume into RAM. start_period must
      # outlast it or the container is marked unhealthy mid-startup.
      start_period: 300s
    cap_drop:
      - ALL
    cap_add:
      # Root process serving /health on :80; privileged-port binds are lost
      # once ALL is dropped.
      - NET_BIND_SERVICE
    networks: [ai-backend-net]
    deploy:
      resources:
        limits:
          # 4g, and this limit is not what was killing it. Do not raise it.
          # `cat /sys/fs/cgroup/memory.peak` hit 11.8GB -- the whole LXC -- while
          # this container showed 805MiB/8GiB in docker stats. The box ran out of
          # memory, Proxmox SIGKILLed the biggest consumer, and the 8g ceiling
          # here was unreachable dead space: the rest of the stack already holds
          # ~2.4GB of an 11GB budget. `.State.OOMKilled` reads false because the
          # kill happens above Docker, at the LXC boundary.
          # 4g is a real ceiling that leaves the stack room to coexist. If TEI
          # is still SIGKILLed at 4g with ~1.2GB of fp16 weights, the honest
          # conclusion is that bge-m3 on CPU does not fit on an 11GB LXC -- go
          # back to open-webui's in-process embeddings rather than raise this.
          memory: 4g
          cpus: "2.0"

volumes:
  # Named, not a bind mount: the deployer user must not need write access to the
  # repo checkout to update the model.
  tei-model:

networks:
  ai-net:
    external: true
  ai-backend-net:
    external: true
    name: shared-ai-backend-net
