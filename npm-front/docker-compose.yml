x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  npm-front:
    image: jc21/nginx-proxy-manager:2.16.0@sha256:4393e642e233e5efd5adeb7f10918d4aaea71c9ed875b94190273fc8e87f9594
    container_name: ${NPM_FRONT_CONTAINER_NAME:-npm-front}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    volumes:
      - ./npm-front/data:/data
      - ./npm-front/letsencrypt:/etc/letsencrypt
      - /etc/localtime:/etc/localtime:ro
    networks:
      - anubis-net
      - npm-net
    ports:
      # Public TLS edge: must listen on all interfaces, this is the only
      # place the internet may reach.
      - '80:80'
      - '443:443'
      # Admin Web UI on 82 (the internal router keeps 81), HOST_IP-bound.
      - '${HOST_IP:-127.0.0.1}:82:81'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:81/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    cap_add:
      # Binds 80/443/81 in-container, so NET_BIND_SERVICE survives the drop.
      # /init may chown/chmod /data and spawn the nginx workers below root,
      # hence the file trio (same set the npm/ router instance needs).
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          # Same sizing as the npm/ router instance: nginx + Node admin UI
          # idles small, with a ~25MB/day leak reported in NPM #4182 --
          # 512m absorbs it.
          memory: 512m
          cpus: "1.0"

networks:
  # Shared with the Anubis gateway (forward target anubis:8923).
  # Create once per host: docker network create anubis-net
  anubis-net:
    external: true
  npm-net:
    external: true
