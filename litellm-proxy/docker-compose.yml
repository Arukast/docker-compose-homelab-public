x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  litellm-proxy:
    image: ghcr.io/berriai/litellm:v1.103.2
    container_name: ${LITELLM_PROXY_CONTAINER_NAME:-litellm-proxy}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    ports:
      - "${HOST_IP:-127.0.0.1}:4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - DATABASE_URL=postgresql://litellm:${POSTGRES_PASSWORD:-litellm_db_pass}@postgres:5432/litellm
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      # litellm-config.yaml resolves api_base via os.environ/OMNIROUTE_API_BASE
      - OMNIROUTE_API_BASE=${OMNIROUTE_API_BASE:-http://omniroute:20128/v1}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY}
      - PRESIDIO_ANALYZER_API_BASE=${PRESIDIO_ANALYZER_API_BASE:-http://presidio-analyzer:3000}
      - PRESIDIO_ANONYMIZER_API_BASE=${PRESIDIO_ANONYMIZER_API_BASE:-http://presidio-anonymizer:3000}
    command: ["--config", "/app/config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [ai-net, ai-backend-net]
    deploy:
      resources:
        limits:
          # Official prod docs floor: "1 vCPU and 4Gi … a floor rather than a
          # target" (docs.litellm.ai/docs/proxy/prod). Was 1g and sat at 95.77%.
          memory: 4g
          cpus: "1.0"

  postgres:
    image: postgres:18-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm_db_pass}
      POSTGRES_DB: litellm
    volumes:
      - ./postgres_data:/var/lib/postgresql
    networks: [ai-backend-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          # 57MiB idle, but shared_buffers scales with host RAM when uncapped
          memory: 512m
          cpus: "1.0"

networks:
  ai-net:
    external: true
  ai-backend-net:
    external: true
    name: shared-ai-backend-net
