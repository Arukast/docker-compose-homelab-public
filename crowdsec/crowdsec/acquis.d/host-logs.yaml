# Host auth/syslog for the crowdsecurity/linux + sshd scenarios (mounted
# from the host's /var/log at /var/log/host). On hosts that run only
# journald there is no auth.log -- drop the missing paths here, or switch
# the image to crowdsecurity/crowdsec:*-debian with a journalctl DSN.
filenames:
  - /var/log/host/auth.log
  - /var/log/host/syslog
labels:
  type: syslog
