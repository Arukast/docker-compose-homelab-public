x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # CyberChef -- the Cyber Swiss Army Knife (encryption, encoding,
  # compression, data analysis). Pure static frontend, no volumes.
  # mpepping's image is nginx-unprivileged serving on 8000.
  cyberchef:
    image: mpepping/cyberchef:v11.5.0
    container_name: ${CYBERCHEF_CONTAINER_NAME:-cyberchef}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    ports:
      - "${HOST_IP:-127.0.0.1}:${CYBERCHEF_PORT:-8000}:8000"
    healthcheck:
      # Mirrors the image's own HEALTHCHECK.
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:8000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    networks: [cyberchef-net]
    deploy:
      resources:
        limits:
          # Static frontend, ~120MB image. 128m is ample.
          memory: 128m

networks:
  cyberchef-net:
    driver: bridge
