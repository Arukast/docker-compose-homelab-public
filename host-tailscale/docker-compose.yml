services:
  tailscale:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: ${TAILSCALE_CONTAINER_NAME}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    hostname: ${HOSTNAME}
    network_mode: "host"
    cap_drop:
      - ALL
    cap_add:
      # NET_ADMIN: configure interfaces and routes for the tailnet.
      # NET_RAW: disco/STUN probing. Tailscaled itself serves only 41641/udp,
      # so nothing else survives the drop.
      - NET_ADMIN
      - NET_RAW
      # ./tailscale/state is deployer-owned (old setup-target.sh chown -R);
      # without DAC_OVERRIDE root cannot open tailscaled.state, the state
      # store fails to initialize and the backend refuses to start. FOWNER
      # covers the chmod tailscaled applies on state migration.
      - DAC_OVERRIDE
      - FOWNER
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=${TS_USERSPACE}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS}
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - /lib/modules:/lib/modules:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          # No official sizing published; idles in the tens of MB, with known
          # memory-growth issues (tailscale #7571, #18774).
          memory: 256m
          cpus: "0.5"
