x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  searxng:
    image: docker.io/searxng/searxng:2026.9.23-783a09462@sha256:5ea5f6804364e6075a44cb776a291a6ca1715380d653c8a4784ede436d5080cf
    container_name: ${SEARXNG_CONTAINER_NAME:-searxng}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    volumes:
      - ./searxng-data/settings.yml:/etc/searxng/settings.yml:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://searxng:8080/}
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    networks: [ai-net]
    deploy:
      resources:
        limits:
          # was 256m; searxng rate-limits and caches in-process, 384m is safer
          memory: 384m
          cpus: "1.0"

networks:
  ai-net:
    external: true
