x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  hermes-agent:
    image: nousresearch/hermes-agent:v2026.9.24
    working_dir: /opt/data
    container_name: ${HERMES_CONTAINER_NAME:-hermes-agent}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    tty: true
    stdin_open: true
    ports:
      - "${HOST_IP:-127.0.0.1}:8642:8642"
      - "${HOST_IP:-127.0.0.1}:9119:9119"
    volumes:
      - ./hermes-data:/opt/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://litellm-proxy:4000/v1}
      # Must be litellm-proxy's LITELLM_MASTER_KEY, not OmniRoute's key
      - OPENAI_API_KEY=${LITELLM_API_KEY}
      - HERMES_DASHBOARD=${HERMES_DASHBOARD:-true}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://searxng:8080}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9119/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [ai-net]
    deploy:
      resources:
        limits:
          # was 512m, running at 61.7% -- close to OOM on a busy agent turn
          memory: 768m

networks:
  ai-net:
    external: true
