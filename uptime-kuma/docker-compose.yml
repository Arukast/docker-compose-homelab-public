services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    container_name: ${UPTIME_KUMA_CONTAINER_NAME}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./uptime-kuma/data:/app/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - npm-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "extra/healthcheck.js"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          # No official sizing published; ~102MiB idle on SQLite, 512m covers
          # monitor spikes (uptime-kuma #5884).
          memory: 512m
          cpus: "1.0"

networks:
  npm-net:
    external: true
