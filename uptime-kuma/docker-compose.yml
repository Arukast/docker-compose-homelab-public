services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.8@sha256:20abea8c48a163cf0a7a5d5936ab418e4b742d908704e1f58f6c06e56a9c6b67
    container_name: ${UPTIME_KUMA_CONTAINER_NAME}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./uptime-kuma/data:/app/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - npm-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "extra/healthcheck.js"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    cap_drop:
      - ALL
    cap_add:
      # ./uptime-kuma/data holds container-assigned uid-1000 files (see the
      # setup-target.sh note), so the root process touching them needs
      # DAC_OVERRIDE/FOWNER; CHOWN covers a chown at boot and SETUID/SETGID
      # covers spawning the uid-1000 helper process.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      # Ping monitors spawn `ping`, which opens a raw ICMP socket. Without
      # NET_RAW every ping check fails with "spawn EPERM" (uptime-kuma#373).
      - NET_RAW
    deploy:
      resources:
        limits:
          # No official sizing published; ~102MiB idle on SQLite, 512m covers
          # monitor spikes (uptime-kuma #5884).
          memory: 512m
          cpus: "1.0"

networks:
  npm-net:
    external: true
