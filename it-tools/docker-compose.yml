x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # IT-Tools -- handy dev/IT utilities in one web UI (encoders, converters,
  # generators, formatters, network tools). Stateless, no volumes.
  #
  # Image is sharevb's maintained rebuild, not corentinth's own tag: the
  # official corentinth/it-tools image has not been rebuilt since Oct 2024,
  # while sharevb tracks upstream and publishes date-pinned tags. It serves
  # on 8080 (nginx-unprivileged base), not 80.
  it-tools:
    image: sharevb/it-tools:2026.9.27
    container_name: ${IT_TOOLS_CONTAINER_NAME:-it-tools}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    ports:
      - "${HOST_IP:-127.0.0.1}:${IT_TOOLS_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    networks: [it-tools-net]
    deploy:
      resources:
        limits:
          # Static frontend, ~90MB image. 128m is ample.
          memory: 128m

networks:
  it-tools-net:
    driver: bridge
