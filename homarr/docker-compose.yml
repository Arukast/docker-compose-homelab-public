services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:v2.1.1@sha256:e438916dec2ef99985a3a276f3499b09eca31bf35fc673f7451538016a336955
    container_name: ${HOMARR_CONTAINER_NAME}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - dashboard-net
    ports:
      - "${HOST_IP:-127.0.0.1}:7575:7575"
    environment:
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - DOCKER_HOSTNAMES=${DOCKER_HOSTNAMES}
      - DOCKER_PORTS=${DOCKER_PORTS}
      - DOCKER_NAMES=${DOCKER_NAMES}
      - AUTH_PROVIDERS=${AUTH_PROVIDERS}
      - AUTH_OIDC_CLIENT_ID=${AUTH_OIDC_CLIENT_ID}
      - AUTH_OIDC_CLIENT_SECRET=${AUTH_OIDC_CLIENT_SECRET}
      - AUTH_OIDC_ISSUER=${AUTH_OIDC_ISSUER}
      - AUTH_OIDC_CLIENT_NAME=${AUTH_OIDC_CLIENT_NAME}
      - AUTH_OIDC_SCOPE_OVERWRITE=${AUTH_OIDC_SCOPE_OVERWRITE}
      - AUTH_OIDC_GROUPS_ATTRIBUTE=${AUTH_OIDC_GROUPS_ATTRIBUTE}
      - AUTH_OIDC_ADMIN_GROUP=${AUTH_OIDC_ADMIN_GROUP}
    volumes:
      - ./homarr/appdata:/appdata
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7575 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    cap_drop:
      - ALL
    cap_add:
      # /app/entrypoint.sh runs first as root; keep the house trio so a chown
      # or privilege drop inside it cannot EPERM once ALL is dropped.
      - CHOWN
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          # Official docs floor is 500MB (homarr.dev getting-started), but
          # issues #3759/#6123 report 600MB-1GB observed on dashboards.
          memory: 1g
          cpus: "1.0"

networks:
  dashboard-net:
    driver: bridge
