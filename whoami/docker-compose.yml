services:
  whoami:
    image: traefik/whoami:v1.12@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    container_name: whoami
    restart: unless-stopped
    networks:
      - whoami-net
    ports:
      - "${HOST_IP:-127.0.0.1}:8080:80" # Listens on port 8080 on the host
    cap_drop:
      - ALL
    cap_add:
      # Root process listening on :80 in-container; privileged-port binds are
      # lost once ALL is dropped.
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          # No official sizing published; tiny Go echo server, safety cap only.
          memory: 64m
          cpus: "0.5"

networks:
  whoami-net:
    driver: bridge
