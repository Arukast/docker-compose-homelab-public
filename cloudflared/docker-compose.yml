services:
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: ${CLOUDFLARED_CONTAINER_NAME}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: ${COMMAND}
    networks:
      - cloudflared-net
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          # Official system requirements ask 4GB/4 CPU per dedicated host --
          # that is port-count capacity sizing, not a per-container floor.
          # One tunnel replica idles well under 1g.
          memory: 1g
          cpus: "1.0"

networks:
  cloudflared-net:
    external: true
