x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  presidio-analyzer:
    image: ghcr.io/data-privacy-stack/presidio-analyzer:2.2.364
    container_name: ${PRESIDIO_ANALYZER_CONTAINER_NAME:-presidio-analyzer}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    volumes:
      # Two separate configs: the server config (nlp engine) and the recognizer
      # registry. The env var is RECOGNIZER_REGISTRY_CONF_FILE, not
      # ANALYZER_REGISTRY_CONF_FILE -- the latter is silently ignored, so the
      # registry falls back to the image's conf/default_recognizers.yaml and
      # every custom pattern vanishes without any error.
      - ./analyzer-config.yaml:/app/config/analyzer-config.yaml:ro
      - ./secret_recognizers.yaml:/app/config/secret_recognizers.yaml:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - ANALYZER_CONF_FILE=${ANALYZER_CONF_FILE:-/app/config/analyzer-config.yaml}
      - RECOGNIZER_REGISTRY_CONF_FILE=${RECOGNIZER_REGISTRY_CONF_FILE:-/app/config/secret_recognizers.yaml}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    networks: [ai-backend-net]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          # en_core_web_lg is ~800MB of weights and loads fully resident, so this
          # must clear 1g or the worker is OOM-killed on first request. 2g covers
          # the model plus request-time headroom.
          memory: 2g
          cpus: "1.0"

  presidio-anonymizer:
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:2.2.364
    container_name: ${PRESIDIO_ANONYMIZER_CONTAINER_NAME:-presidio-anonymizer}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    networks: [ai-backend-net]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          # Stateless transform step; no model loaded, footprint stays small.
          memory: 256m
          cpus: "0.5"

networks:
  ai-backend-net:
    external: true
    name: shared-ai-backend-net
