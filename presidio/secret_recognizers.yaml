# Analyzer server config: the image's own default.yaml, plus the built-in
# recognizer registry, plus the custom secret patterns.
#
# ANALYZER_CONF_FILE REPLACES the server config -- it does not merge. A file
# carrying only `recognizer_registry:` therefore discards every built-in
# recognizer, which is why PII entities went missing. Everything the image ships
# must be re-listed here explicitly.
nlp_engine_name: spacy
models:
  -
    lang_code: en
    model_name: en_core_web_lg

ner_model_configuration:
  model_to_presidio_entity_mapping:
    PER: PERSON
    PERSON: PERSON
    NORP: NRP
    FAC: LOCATION
    LOC: LOCATION
    GPE: LOCATION
    LOCATION: LOCATION
    ORG: ORGANIZATION
    ORGANIZATION: ORGANIZATION
    DATE: DATE_TIME
    TIME: DATE_TIME
  low_confidence_score_multiplier: 0.4
  low_score_entity_names: []
  labels_to_ignore:
    - ORGANIZATION # Has many false positives
    - CARDINAL
    - EVENT
    - LANGUAGE
    - LAW
    - MONEY
    - ORDINAL
    - PERCENT
    - PRODUCT
    - QUANTITY
    - WORK_OF_ART

# Built-ins, re-listed. Dropping any one of these silently removes that entity.
# `type: predefined` is required: without it presidio tries to build a custom
# PatternRecognizer from these dicts instead of loading the shipped class.
recognizer_registry:
  recognizers:
    - name: CreditCardRecognizer
      type: predefined
    - name: CryptoRecognizer
      type: predefined
    - name: DateRecognizer
      type: predefined
    - name: EmailRecognizer
      type: predefined
    - name: IbanRecognizer
      type: predefined
    - name: IpRecognizer
      type: predefined
    - name: MacAddressRecognizer
      type: predefined
    - name: MedicalLicenseRecognizer
      type: predefined
    - name: NhsRecognizer
      type: predefined
    - name: PhoneRecognizer
      type: predefined
    - name: SpacyRecognizer
      type: predefined
    - name: UrlRecognizer
      type: predefined
    - name: UsBankRecognizer
      type: predefined
    - name: UsItinRecognizer
      type: predefined
    - name: UsLicenseRecognizer
      type: predefined
    - name: UsPassportRecognizer
      type: predefined
    - name: UsSsnRecognizer
      type: predefined
    - name: SecretKeyRecognizer
      supported_language: "en"
      supported_entity: "SECRET_KEY"
      patterns:
        - name: "aws_access_key_id"
          regex: '\b(?:AKIA|ASIA|ABIA|ACCA|A3T)[A-Z0-9]{16}\b'
          score: 0.98
        - name: "github_token"
          regex: '\bgh[pousr]_[a-zA-Z0-9]{36,}\b'
          score: 0.98
        - name: "github_fine_grained_pat"
          regex: '\bgithub_pat_[a-zA-Z0-9]{22}_[a-zA-Z0-9]{59}\b'
          score: 1.00
        - name: "gitlab_personal_access_token"
          regex: '\bglpat-[a-zA-Z0-9\-]{20,}\b'
          score: 0.98
        - name: "openai_api_key"
          regex: '\bsk-(?:proj|svcacct|admin)-[a-zA-Z0-9_\-]{32,}\b'
          score: 0.95
        - name: "openai_legacy_api_key"
          regex: '\bsk-[a-zA-Z0-9_\-]*T3BlbkFJ[a-zA-Z0-9_\-]*\b'
          score: 0.95
        - name: "anthropic_api_key"
          regex: '\bsk-ant-(?:api03|admin01)-[a-zA-Z0-9_\-]{32,}AA\b'
          score: 0.98
        - name: "openrouter_api_key"
          regex: '\bsk-or-v1-[a-f0-9]{64}\b'
          score: 0.98
        - name: "google_api_key"
          regex: '\bAIza[a-zA-Z0-9_\-]{35}\b'
          score: 0.95
        - name: "google_oauth_client_secret"
          regex: '\bGOCSPX-[a-zA-Z0-9_\-]{28}\b'
          score: 0.98
        - name: "stripe_secret_key"
          regex: '\bsk_(?:live|test)_[a-zA-Z0-9]{24,}\b'
          score: 0.95
        - name: "slack_token"
          regex: '\bxox[bposo]-[0-9]+-[a-zA-Z0-9\-]+\b'
          score: 0.95
        - name: "slack_legacy_workspace_token"
          regex: '\bxox[ar]-(?:[0-9]+-)?[a-zA-Z0-9\-]+\b'
          score: 0.90
        - name: "slack_app_token"
          regex: '\bxapp-[0-9]+-[a-zA-Z0-9\-]+\b'
          score: 0.95
        - name: "slack_webhook_url"
          regex: 'https://hooks\.slack\.com/(?:services|workflows|triggers)/[a-zA-Z0-9_\-/]+'
          score: 0.98
        - name: "npm_access_token"
          regex: '\bnpm_[a-zA-Z0-9]{36}\b'
          score: 0.98
        - name: "sendgrid_api_key"
          regex: '\bSG\.[a-zA-Z0-9_\-]{22}\.[a-zA-Z0-9_\-]{43}\b'
          score: 0.95
        - name: "huggingface_access_token"
          regex: '\bhf_[a-zA-Z0-9]{34,}\b'
          score: 0.95
        - name: "databricks_api_token"
          regex: '\bdapi[a-f0-9]{32}(?:-[0-9]+)?\b'
          score: 0.95
        - name: "atlassian_api_token"
          regex: '\bATATT3[a-zA-Z0-9_\-]{186,}\b'
          score: 0.98
        - name: "doppler_token"
          regex: '\bdp\.(?:pt|st|ct|sa|scim|audit)\.[a-zA-Z0-9_\-]+\b'
          score: 0.98
        - name: "linear_api_key"
          regex: '\blin_api_[a-zA-Z0-9]{40}\b'
          score: 0.98
        - name: "shopify_access_token"
          regex: '\bshp(?:at|ca|pa|ss)_[a-f0-9]{32}\b'
          score: 0.95
        - name: "telegram_bot_token"
          regex: '\b[0-9]{8,10}:[a-zA-Z0-9_-]{35}\b'
          score: 0.90
        - name: "age_secret_key"
          regex: '\bAGE-SECRET-KEY-1[a-z0-9]{58}\b'
          score: 0.98
        - name: "jwt_token"
          regex: '\beyJ[a-zA-Z0-9_-]+\.eyJ[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+\b'
          score: 0.75
        - name: "bitcoin_wif_uncompressed"
          regex: '\b5[HJK][1-9A-HJ-NP-Za-km-z]{49}\b'
          score: 0.80
        - name: "bitcoin_wif_compressed"
          regex: '\b[KLM][1-9A-HJ-NP-Za-km-z]{51}\b'
          score: 0.80
        - name: "bitcoin_extended_private_key"
          regex: '\b(?:[xyztuvU]prv|[YZV]prv)[1-9A-HJ-NP-Za-km-z]{100,}\b'
          score: 0.90
        - name: "ethereum_private_key"
          regex: '\b0x[a-fA-F0-9]{64}\b'
          score: 0.75
        - name: "pem_private_key_block"
          regex: '-----BEGIN (?:[A-Z0-9]+ )?PRIVATE KEY-----\s*[\s\S]*?\s*-----END (?:[A-Z0-9]+ )?PRIVATE KEY-----'
          score: 0.98
        - name: "pypi_upload_token"
          regex: '\bpypi-AgEIcHlwaS5vcmc[a-zA-Z0-9_\-]{50,}\b'
          score: 0.98
        - name: "digitalocean_token"
          regex: '\bdo[pors]_v1_[a-f0-9]{64}\b'
          score: 0.95
